[pytest]

# the tests write to the API, never let them use the ISABL_API_URL of the shell
env =
    ISABL_API_URL=http://localhost:8000/api/v1/
    ISABL_CLIENT_ID=test-cli-client

norecursedirs =
    .git
    .tox
    .env
    dist
    build
    south_migrations
    migrations
    docker
    perl
    r

python_files =
    test_*.py
    *_test.py
    tests.py

addopts =
    -rxEfsw
    --strict-markers
    --doctest-modules
    --doctest-glob=\*.rst
    --tb=short
    --ignore=setup.py,isabl_cli
